name: Altimeter

options:
  bundleIdPrefix: ai.errarium
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: ru
    MARKETING_VERSION: "1.2.3"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 76UD6VNBTE
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO

targets:
  Altimeter:
    type: application
    platform: iOS
    sources:
      - path: Altimeter
        excludes:
          - Supporting/Info.plist
          - Supporting/Altimeter.entitlements
          - Resources
      - path: Altimeter/Resources
        buildPhase: resources
    entitlements:
      path: Altimeter/Supporting/Altimeter.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.ai.errarium.altimeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.errarium.altimeter
        PRODUCT_NAME: Altimeter
        MARKETING_VERSION: "1.2.3"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_FILE: Altimeter/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Altimeter/Supporting/Altimeter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          ALTIMETER_APP_PROFILE_NAME: Errarium Altimeter Ad Hoc plus
          PROVISIONING_PROFILE_SPECIFIER: $(ALTIMETER_APP_PROFILE_NAME)
    dependencies:
      - target: AltimeterWidget

  AltimeterWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AltimeterWidget
        excludes:
          - Info.plist
          - AltimeterWidget.entitlements
          - PrivacyInfo.xcprivacy
      - path: Altimeter/Shared/WidgetSnapshotStore.swift
      - path: AltimeterWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: AltimeterWidget/AltimeterWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.errarium.altimeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.errarium.altimeter.widget
        PRODUCT_NAME: AltimeterWidget
        MARKETING_VERSION: "1.2.3"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_FILE: AltimeterWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AltimeterWidget/AltimeterWidget.entitlements
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          ALTIMETER_WIDGET_PROFILE_NAME: Errarium Altimeter Widget Ad Hoc plus
          PROVISIONING_PROFILE_SPECIFIER: $(ALTIMETER_WIDGET_PROFILE_NAME)

  AltimeterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AltimeterTests
    dependencies:
      - target: Altimeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.errarium.altimeter.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Altimeter:
    build:
      targets:
        Altimeter: all
        AltimeterWidget: all
        AltimeterTests: [test]
    test:
      targets:
        - AltimeterTests
