name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Prepare stable Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/errarium-android.keystore"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/errarium-android.keystore" >> "$GITHUB_ENV"
      - name: Test and build release APK
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease
      - name: Verify version and stable signing certificate
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          BADGING="$("$TOOLS/aapt" dump badging "$APK" | head -1)"
          CERTIFICATES="$("$TOOLS/apksigner" verify --print-certs "$APK")"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$CERTIFICATES"
          printf '%s' "$BADGING" | grep -F "versionCode='23' versionName='1.6.3'"
          printf '%s' "$CERTIFICATES" | tr '[:lower:]' '[:upper:]' \
            | grep -F "16554CC9CDA37C649AF0D9B291255A3EB0DF5A1DD1FD0C9EDA5E48F661B9CAC2"
          cp "$APK" "app/build/outputs/apk/release/Altimeter-Kailas-Android-1.6.3.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Altimeter-Kailas-Android-1.6.3
          path: app/build/outputs/apk/release/Altimeter-Kailas-Android-1.6.3.apk

  navigation-smoke:
    name: Navigation + precise track — 5 full cycles
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run navigation and precise-track tests in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --stacktrace
          if-no-files-found: error
