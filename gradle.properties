org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Huawei Wear Engine (P2P) ---
# Пакет и SHA-256-отпечаток подписи ВАШЕГО приложения на часах (HarmonyOS quick app).
# Нужны только для канала Wear Engine; канал уведомлений работает без них.
WATCH_APP_PACKAGE=com.chelmodeev.altimeter.watch
WATCH_APP_FINGERPRINT=

# --- HUAWEI Health Kit (пульс и SpO2 с Huawei Watch) ---
# Числовой App ID Android-приложения из HUAWEI Developers/AppGallery Connect.
# Пакет там должен быть com.chelmodeev.altimeter, а SHA-256 сертификата —
# совпадать с ключом, которым подписан устанавливаемый APK.
HUAWEI_APP_ID=
